
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="bg-light">

    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="card shadow-sm w-100 col-md-6 col-lg-5" style="max-width: 500px;">
            <div class="card-body p-4">

                <h1 class="text-center fs-4 mb-4">Roth IRA Calculator</h1>

                <form action="/submitform">

                    
                    <div class="row align-items-center mb-3">
                        <label for="balance" class="col-md-6 col-form-label">
                            Balance ($)
                        </label>
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="balance" name="balance">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="annual" class="col-md-6 col-form-label">
                            Annual Contribution ($)
                        </label>
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="annual" name="annual">
                        </div>
                    </div>

                    <fieldset class="row mb-3">
                        <legend class="col-md-6 col-form-label">
                            Maximize contribution?
                        </legend>

                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="maximize" id="yes" value="yes">
                                <label class="form-check-label" for="yes">Yes</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="maximize" id="no" value="no">
                                <label class="form-check-label" for="no">No</label>
                            </div>
                        </div>
                    </fieldset>

                    <div class="row align-items-center mb-3">
                        <label for="rate" class="col-md-6 col-form-label">
                            Expected return (%)
                        </label>
                        <div class="col-md-6">
                            <input type="number" class="form-control" id="rate" name="rate">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="age" class="col-md-6 col-form-label">
                            Current age
                        </label>
                        <div class="col-md-6">
                            <input type="number" class="form-control" id="age" name="age">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="retire" class="col-md-6 col-form-label">
                            Retirement age
                        </label>
                        <div class="col-md-6">
                            <input type="number" class="form-control" id="retire" name="retire">
                        </div>
                    </div>

                    <div class="row align-items-center mb-4">
                        <label for="tax" class="col-md-6 col-form-label">
                            Tax rate (%)
                        </label>
                        <div class="col-md-6">
                            <input type="number" class="form-control" id="tax" name="tax">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <button type="submit" class="btn btn-primary w-100">
                                Calculate
                            </button>
                        </div>

                        <div class="col-6">
                            <button type="reset" class="btn btn-outline-secondary w-100">
                                Reset
                            </button>
                        </div>
                    </div>

                    <p class="small mb-0">
                        This exercise is a simplified version of the Roth IRA Calculator at
                        <a href="https://www.calculator.net/" target="_blank" rel="noopener noreferrer">Calculator.net</a>
                    </p>

                </form>
            </div>
        </div>

    </main>

</body>
</html>
