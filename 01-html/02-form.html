<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 02 - Form</title>
    <style>
      fieldset {
        margin: 0;
        border: 0;
        padding: 0px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ROTH IRA Calculator</h1>
      <form action = "/submitform">
        <div>
          <label for = "balance">Balance ($)</label><br>
          <input type="text" id="balance" name="balance"><br>
        </div>
        <br>
        <div>
          <label for = "annual">Annual Contribution</label><br>
          <input type="text" id="annual" name="annual"><br>
        </div>
        <br>
        <fieldset>
          <legend>Maximize Contributions?</legend>
          <input type ="radio" id="yes" name="maximize" value="yes">
          <label for="yes">Yes</label>
          <input type ="radio" id="no" name="maximize" value="no">
          <label for="no">No</label>
        </fieldset>
        <br>
        <div>
          <label for="rate">Expected rate of return (%)</label>
          <input type="number" id="rate" name="rate"><br>
        </div>
        <br>
        <div>
          <label for="age">Current Age</label>
          <input type="number" id="age" name="age"><br>
        </div>
        <br>
        <div>
          <label for="retire">Retirement Age</label>
          <input type="number" id="retire" name="retire"><br>
        </div>
        <br>
        <div>
          <label for="tax">Marginal Tax Rate (%)</label>
          <input type="number" id="tax" name="tax"><br>
        </div>
        <br>
        <div>
          <input type="submit" value="Calculate">
          <input type="reset" value="Reset">
        </div>
        <p>This exercise is a simplified version of the ROTH IRA Calculator at <a href="https://www.calculator.net/" >Calculator.net</a></p>
      </form>
    </main>
  </body>
</html>
