<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 01 - Audit</title>
  </head>
  <body>
    <main>
      <h1>Purchase Form</h1>
      <form>
        <label for="name">Name:</label><br />
        <input type="text" id="name" name="name" /><br /><br />
        <label for="address">Address:</label><br />
        <input type="text" id="address" name="address" />
        <br /><br />
        <label for="city">City:</label><br/>
        <input type="text" id="city" name="city" />
        <br /><br />
        <label for = "zip">Zip Code:</label><br />
        <input type="text" name="zip" id ="zip" />
        <br /><br />
        <fieldset>
          <legend for="card">Credit Card Type:</legend>
          <input type="radio" name="card" value="visa" id="visa"/>
          <label for="visa">Visa</label><br>
          <input type="radio" name="card" value="mastercard" id="mastercard"/> 
          <label for="mastercard">Mastercard</label><br>
          <input type="radio" name="card" value="amex" id="amex"/>
          <label for="amex">American Express</label><br>
        </fieldset>
        <label for="cc_number">Credit Card Number:</label><br />
        <input type="text" name="cc_number" id="cc_number" /><br /><br />
        <label for="cvv">CVV:</label>
        <br />
        <input type="text" name="cvv" id="cvv"/><br /><br />
        <input type="button" value="Submit" />
      </form>
    </main>
  </body>
</html>
